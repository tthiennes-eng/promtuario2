name: promt
description: "Sistema de Gerenciamento para Clínica Escola Odontológica Universitária."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^13.2.0

  # FFI Explicit
  ffi: ^2.1.2

  # Local Database
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.42

  # Network
  dio: ^5.4.1
  signalr_netcore: ^1.3.5

  # Security & Storage
  flutter_secure_storage: ^9.2.2

  # Modeling
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Utils
  intl: any
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
