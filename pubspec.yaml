name: promt
description: "Sistema de Gerenciamento para Clínica Escola Odontológica Universitária."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  
  # State Management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Navigation
  go_router: ^18.1.4

  # FFI Explicit
  ffi: ^2.1.2

  # Local Database
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.6.0+eol

  # Network
  dio: ^5.4.1
  signalr_netcore: ^1.3.5

  # Security & Storage
  flutter_secure_storage: ^11.2.0

  # Modeling
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Utils
  intl: any
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  drift_dev: ^2.35.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  analyzer: ^14.7.0

flutter:
  uses-material-design: true
